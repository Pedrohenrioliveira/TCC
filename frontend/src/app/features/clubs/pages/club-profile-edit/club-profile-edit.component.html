<div class="profile-edit-container">
  
  <h1 class="page-title">Editar Perfil do Clube</h1>

  <div class="form-card">
    
    <!-- Photo Upload Section -->
    <div class="photo-section">
      <div class="photo-dashed-border">
        <div class="photo-circle">
          <img *ngIf="photoUrl && photoUrl !== 'assets/default-club.png'" [src]="photoUrl" alt="Escudo" class="profile-img">
          <svg *ngIf="!photoUrl || photoUrl === 'assets/default-club.png'" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="default-shield">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
      </div>
      <button class="change-photo-btn" (click)="fileInput.click()">Alterar Escudo</button>
      <input #fileInput type="file" hidden accept="image/*" (change)="onFileSelected($event)">
    </div>

    <!-- Form Fields -->
    <form class="profile-form" [formGroup]="profileForm">
      
      <div class="form-group">
        <label class="floating-label">Nome do Clube</label>
        <input type="text" class="form-control" formControlName="nome" placeholder="Ex: F.C. Diamante">
      </div>

      <div class="form-group">
        <label class="floating-label">Cidade / Estado</label>
        <input type="text" class="form-control" formControlName="cidadeEstado" placeholder="Ex: São Paulo - SP">
      </div>

      <div class="form-group">
        <label class="floating-label">Contato / Telefone</label>
        <input type="tel" class="form-control" formControlName="contato" placeholder="Ex: (11) 98765-4321">
      </div>
      
      <!-- Campos adicionais que o backend precisa -->
      <div class="form-group">
        <label class="floating-label">Ano de Fundação</label>
        <input type="number" class="form-control" formControlName="anoFundacao" placeholder="Ex: 1990">
      </div>

      <div class="form-group">
        <label class="floating-label">Liga/Competição</label>
        <input type="text" class="form-control" formControlName="ligaCompeticao" placeholder="Ex: Liga Amadora">
      </div>

      <div class="form-group">
        <label class="floating-label">Estádio / Arena Principal</label>
        <input type="text" class="form-control" formControlName="estadioPrincipal" placeholder="Ex: Arena Diamante">
      </div>

      <div class="form-group">
        <label class="floating-label">Breve História</label>
        <textarea class="form-control textarea-field" formControlName="breveHistoria" placeholder="Conte um pouco sobre o clube..." rows="3"></textarea>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" class="btn-save" (click)="saveData()" [disabled]="loading">
          <svg *ngIf="!loading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span *ngIf="loading">Salvando...</span>
          <span *ngIf="!loading">Salvar Alterações</span>
        </button>
        <button type="button" class="btn-cancel" routerLink="/club/home">Cancelar</button>
      </div>

    </form>

    <div class="logout-section">
      <button class="btn-logout" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Sair da Conta
      </button>
    </div>

  </div>
</div>
