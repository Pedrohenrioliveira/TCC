<div class="tournaments-container">
  
  <div class="header-actions">
    <h1 class="page-title">Campeonatos</h1>
    <button class="action-btn dark-btn" (click)="toggleForm()">
      {{ showForm ? 'Voltar para Lista' : '+ Novo Campeonato' }}
    </button>
  </div>

  <!-- Form Section -->
  <div class="form-section light-card" *ngIf="showForm">
    <h3 class="t-title mb-3">Criar Novo Campeonato</h3>
    <form [formGroup]="form" (ngSubmit)="criarCampeonato()" class="modern-form">
      
      <div class="form-row">
        <div class="form-group">
          <label>Nome do Campeonato</label>
          <input type="text" formControlName="nome" placeholder="Ex: Copa dos Campeões">
        </div>
        <div class="form-group">
          <label>Local (Estádio/Arena)</label>
          <input type="text" formControlName="local" placeholder="Ex: Arena Sul">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Data de Início</label>
          <input type="date" formControlName="dataInicio">
        </div>
        <div class="form-group">
          <label>Data de Fim</label>
          <input type="date" formControlName="dataFim">
        </div>
        <div class="form-group">
          <label>Limite de Equipes</label>
          <input type="number" formControlName="limiteEquipes" min="2">
        </div>
      </div>

      <button type="submit" class="action-btn dark-btn" [disabled]="form.invalid">Salvar Campeonato</button>
    </form>
  </div>

  <!-- List Section -->
  <div class="cards-list" *ngIf="!showForm">
    <div *ngIf="campeonatos.length === 0" class="empty-state">
      <p>Nenhum campeonato encontrado.</p>
    </div>

    <!-- Card -->
    <div class="tournament-card light-card" *ngFor="let camp of campeonatos">
      <div class="card-top">
        <div class="title-col">
          <h3 class="t-title">{{ camp.nome }}</h3>
          <span class="status-badge" [ngClass]="{'open': camp.status === 1, 'warning': camp.status === 2, 'closed': camp.status === 3}">
            {{ camp.status === 1 ? 'Aberto' : (camp.status === 2 ? 'Em Andamento' : 'Finalizado') }}
          </span>
        </div>
        <div class="icon-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5v0a5 5 0 0 1 5-5z"></path>
          </svg>
        </div>
      </div>

      <div class="card-details">
        <div class="detail-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span>Limite: {{ camp.limiteEquipes }} Equipes</span>
        </div>
        <div class="detail-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Início: {{ camp.dataInicio | date:'dd/MM/yyyy' }}</span>
        </div>
      </div>

      <button class="action-btn dark-btn mt-2" (click)="inscreverClube(camp.id)" *ngIf="camp.status === 1">Inscrever Meu Clube</button>
    </div>

  </div>
</div>
