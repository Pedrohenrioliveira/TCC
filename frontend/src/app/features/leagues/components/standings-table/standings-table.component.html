<div class="table-container">
  <table class="standings-table">
    <thead>
      <tr>
        <th class="col-pos">POS</th>
        <th class="col-team">CLUBE</th>
        <th class="col-pts">P</th>
        <th class="col-j">J</th>
        <th class="col-v">V</th>
        <th class="col-e">E</th>
        <th class="col-d">D</th>
        <th class="col-sg">SG</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let team of teams; let i = index">
        <td class="col-pos">
          <span class="pos-text" [class.top-tier]="i < 3">{{ team.posicao }}º</span>
        </td>
        <td class="col-team">
          <div class="team-info" style="display: flex; align-items: center; gap: 10px;">
            <div class="team-logo-wrapper" *ngIf="team.escudoUrl">
              <img [src]="team.escudoUrl" alt="Escudo" class="team-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
              <div class="default-shield" style="display: none; width: 32px; height: 32px; border-radius: 50%; background-color: #f0f2fb; color: var(--primary-dark-green); align-items: center; justify-content: center; font-size: 14px;">
                <i class="fas fa-shield-alt"></i>
              </div>
            </div>
            <div class="default-shield" *ngIf="!team.escudoUrl" style="width: 32px; height: 32px; border-radius: 50%; background-color: #f0f2fb; color: var(--primary-dark-green); display: flex; align-items: center; justify-content: center; font-size: 14px;">
              <i class="fas fa-shield-alt"></i>
            </div>
            <span class="team-name">{{ team.nomeClube }}</span>
          </div>
        </td>
        <td class="col-pts font-bold">{{ team.pontos }}</td>
        <td class="col-j">{{ team.jogos }}</td>
        <td class="col-v">{{ team.vitorias }}</td>
        <td class="col-e">{{ team.empates }}</td>
        <td class="col-d">{{ team.derrotas }}</td>
        <td class="col-sg">{{ team.saldoGols }}</td>
      </tr>
    </tbody>
  </table>
  <div class="table-footer">
    <button class="view-more-btn">
      Ver tabela completa
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>
</div>

<div class="table-legend">
  <span class="legend-item"><strong>P:</strong> Pontos</span>
  <span class="legend-item"><strong>J:</strong> Jogos</span>
  <span class="legend-item"><strong>V:</strong> Vitórias</span>
  <span class="legend-item"><strong>E:</strong> Empates</span>
  <span class="legend-item"><strong>D:</strong> Derrotas</span>
</div>
