<div class="player-home-container">
  
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Carregando seus dados...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="error-state">
    <p>{{ error }}</p>
    <button (click)="loadDashboardData()" class="retry-btn">Tentar novamente</button>
  </div>

  <!-- Content State -->
  <div *ngIf="!loading && !error && dashboardData" class="content">
    
    <div class="greeting-section">
      <h1 class="greeting-message">Olá, {{ getFirstName(dashboardData.nomeCompleto) }}!</h1>
      <p class="greeting-sub">Pronto para entrar em campo hoje?</p>
    </div>

    <main class="home-main">
      <app-player-summary-card
        [name]="dashboardData.nomeCompleto"
        [position]="dashboardData.posicaoPrincipal"
        [level]="dashboardData.nivel"
        [photoUrl]="dashboardData.caminhoFoto">
      </app-player-summary-card>

      <div class="stats-grid">
        <app-stat-card
          title="Gols na Temporada"
          [value]="dashboardData.golsNaTemporada"
          [variation]="'+' + dashboardData.variacaoGols + '%'"
          [variationIsPositive]="true">
        </app-stat-card>

        <app-stat-card
          title="Assistências"
          [value]="dashboardData.assistencias"
          [variation]="'+' + dashboardData.variacaoAssistencias + '%'"
          [variationIsPositive]="true">
        </app-stat-card>
      </div>

      <!-- Quick Actions -->
      <section class="section-container">
        <div class="quick-actions-row">
          <!-- Buscar Clubes -->
          <a href="/player/available-clubs" class="quick-action-item" style="text-decoration: none; color: inherit;">
            <div class="action-btn-square">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-dark-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <span>Buscar Clubes</span>
          </a>

          <!-- Campeonatos -->
          <a href="/player/tournaments" class="quick-action-item" style="text-decoration: none; color: inherit;">
            <div class="action-btn-square">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-dark-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
            </div>
            <span>Campeonatos</span>
          </a>

          <!-- Classificação -->
          <a href="/player/leagues" class="quick-action-item" style="text-decoration: none; color: inherit;">
            <div class="action-btn-square">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-dark-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
            </div>
            <span>Classificação</span>
          </a>

          <!-- Solicitações/Convites -->
          <a href="/player/club-requests" class="quick-action-item" style="text-decoration: none; color: inherit;">
            <div class="action-btn-square">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-dark-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </div>
            <span>Solicitações</span>
          </a>

          <!-- Meu Perfil -->
          <a href="/player/profile" class="quick-action-item" style="text-decoration: none; color: inherit;">
            <div class="action-btn-square">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-dark-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <span>Meu Perfil</span>
          </a>
        </div>
      </section>

    </main>

  </div>
</div>
