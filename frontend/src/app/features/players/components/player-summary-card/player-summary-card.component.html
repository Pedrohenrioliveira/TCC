<div class="summary-card" routerLink="/player/profile">
  <div class="card-avatar">
    <img [src]="photoUrl || 'assets/default-avatar.png'" alt="Player Photo" class="player-photo">
  </div>
  <div class="card-info">
    <h2 class="player-name">{{ name }}</h2>
    <div class="player-tags">
      <span class="tag-position">{{ position }}</span>
      <span class="tag-level">Nível {{ level }}</span>
    </div>
  </div>
  <div class="card-action">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </div>
</div>
