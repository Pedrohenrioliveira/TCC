<div class="tournaments-container">
  <header class="page-header">
    <h1 class="page-title">Campeonatos</h1>
  </header>

  <div class="filters-container">
    <button class="filter-btn" [class.active]="activeStatus === undefined" (click)="onFilterClick(undefined)">Todos</button>
    <button class="filter-btn" [class.active]="activeStatus === 'aberto'" (click)="onFilterClick('aberto')">Abertos</button>
    <button class="filter-btn" [class.active]="activeStatus === 'andamento'" (click)="onFilterClick('andamento')">Em Andamento</button>
    <button class="filter-btn" [class.active]="activeStatus === 'finalizado'" (click)="onFilterClick('finalizado')">Finalizados</button>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Buscando campeonatos...</p>
  </div>

  <div *ngIf="error" class="error-state">
    <p>{{ error }}</p>
    <button class="retry-btn" (click)="loadTournaments(activeStatus)">Tentar novamente</button>
  </div>

  <div *ngIf="!loading && !error && tournaments.length === 0" class="empty-state">
    Nenhum campeonato encontrado.
  </div>

  <div *ngIf="!loading && !error && tournaments.length > 0" class="cards-grid fade-in">
    <div *ngFor="let t of tournaments" class="tournament-card">
      <div class="card-logo-wrapper">
        <img *ngIf="t.caminhoLogo" [src]="t.caminhoLogo" alt="Logo" class="card-logo">
        <svg *ngIf="!t.caminhoLogo" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="default-logo-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
      </div>

      <div class="card-content">
        <div class="card-header">
          <div class="card-title-group">
            <h3 class="card-title">{{ t.nome }}</h3>
            <p class="card-category">Categoria: Amador A</p>
          </div>
          <span class="status-badge" [ngClass]="getStatusClass(t.status)">
            {{ getStatusName(t.status) }}
          </span>
        </div>

        <div class="card-details">
          <div class="detail-item">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>{{ t.dataInicio | date:'dd/MM/yyyy' }}</span>
          </div>
          <div class="detail-item">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>{{ t.local }}</span>
          </div>
        </div>
        
        <div class="card-footer">
          <button class="action-link" [disabled]="t.status !== 1">
            Ver detalhes
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
