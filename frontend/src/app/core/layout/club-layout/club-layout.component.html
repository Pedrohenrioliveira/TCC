<div class="layout-container">
  
  <!-- Global Top Header -->
  <header class="top-nav">
    <div class="header-left">
      <a routerLink="/club/profile" class="club-avatar-wrapper" style="cursor: pointer;" title="Ir para o perfil">
        <img *ngIf="clubPhoto" [src]="clubPhoto" alt="Escudo do Clube" class="club-avatar" />
        <svg *ngIf="!clubPhoto" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="default-shield">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </a>
      <div class="brand-title">FUTBASE</div>
    </div>
    
    <nav class="desktop-nav">
      <a routerLink="/club/home" routerLinkActive="active">Início</a>
      <a routerLink="/club/roster" routerLinkActive="active">Jogadores</a>
      <a routerLink="/club/lineup" routerLinkActive="active">Escalação</a>
      <a routerLink="/club/requests" routerLinkActive="active">Solicitações</a>
      <a routerLink="/club/tournaments" routerLinkActive="active">Campeonatos</a>
      <a routerLink="/club/profile" routerLinkActive="active">Perfil</a>
    </nav>
    
    <div class="header-right">
      <button class="icon-button notification-btn" aria-label="Notificações">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge"></span>
      </button>
    </div>
  </header>

  <!-- Page Content -->
  <main class="layout-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Bottom Navigation -->
  <nav class="bottom-nav">
    <a routerLink="/club/home" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <span>Início</span>
    </a>

    <a routerLink="/club/roster" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </div>
      <span>Jogadores</span>
    </a>

    <a routerLink="/club/lineup" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      </div>
      <span>Escalação</span>
    </a>

    <a routerLink="/club/requests" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      </div>
      <span>Solicitações</span>
    </a>

    <a routerLink="/club/tournaments" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5v0a5 5 0 0 1 5-5z"></path></svg>
      </div>
      <span>Campeonatos</span>
    </a>

    <a routerLink="/club/profile" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <span>Perfil</span>
    </a>
  </nav>

</div>
