<div class="layout-container">
  
  <!-- Global Top Header (Hidden on Profile Page) -->
  <header class="top-nav" *ngIf="!isProfilePage">
    <div class="header-left" style="display: flex; align-items: center; gap: 12px;">
      <a routerLink="/player/profile" class="user-avatar-wrapper" style="cursor: pointer;" title="Ir para o perfil">
        <img *ngIf="userPhoto" [src]="userPhoto" alt="Avatar do Jogador" class="user-avatar" />
        <svg *ngIf="!userPhoto" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="default-shield">
          <circle cx="12" cy="8" r="5"></circle>
          <path d="M3 21v-2a7 7 0 0 1 14 0v2"></path>
        </svg>
      </a>
      <div class="brand-title">FUTBASE</div>
    </div>
    
    <nav class="desktop-nav">
      <a routerLink="/player/home" routerLinkActive="active">Início</a>
      <a routerLink="/player/leagues" routerLinkActive="active">Classificação</a>
      <a routerLink="/player/tournaments" routerLinkActive="active">Campeonatos</a>
      <a routerLink="/player/available-clubs" routerLinkActive="active">Clubes</a>
      <a routerLink="/player/club-requests" routerLinkActive="active">Solicitações</a>
      <a routerLink="/player/profile" routerLinkActive="active">Perfil</a>
    </nav>

    <div class="header-right">
      <button class="icon-button notification-btn" aria-label="Notificações">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge"></span>
      </button>
    </div>
  </header>

  <!-- Profile Specific Header -->
  <header class="top-nav profile-nav" *ngIf="isProfilePage">
    <button class="back-btn" routerLink="/player/home" aria-label="Voltar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <div class="brand-title">Editar Perfil</div>
    <div style="width: 40px;"></div> <!-- placeholder para centralizar o título -->
  </header>

  <!-- Page Content -->
  <main class="layout-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Bottom Navigation -->
  <nav class="bottom-nav">
    <a routerLink="/player/home" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <span>Início</span>
    </a>

    <a routerLink="/player/leagues" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      </div>
      <span>Classificação</span>
    </a>

    <a routerLink="/player/tournaments" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5v0a5 5 0 0 1 5-5z"></path></svg>
      </div>
      <span>Campeonatos</span>
    </a>

    <a routerLink="/player/available-clubs" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
      </div>
      <span>Clubes</span>
    </a>

    <a routerLink="/player/club-requests" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </div>
      <span>Solicitações</span>
    </a>

    <a routerLink="/player/profile" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <span>Perfil</span>
    </a>
  </nav>

</div>
